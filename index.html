<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ruídos Mentais</title>
<meta name="description" content="Cinco jogos diários de psicologia: Diagnóstico, PsicoTermo, Quem disse?, Conexões e Mito ou verdade.">
<meta name="theme-color" content="#151826">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>


<header class="top">
  <button class="brand" id="home" aria-label="Início de Ruídos Mentais"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12.5l1.6-3.4 1.5 6.6 1.6-9 1.5 9.6 1.4-6.2 1.1 2.2c1.6-4.6 3-6.3 5-6.3 2.2 0 3.6 5.8 5.8 5.8"/></svg></span>Ruídos Mentais</button>
  <div class="top-actions">
    <div class="streak" role="status" title="Dias seguidos com todos os jogos concluídos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13h3.2l2-6 3.6 11 3-14 2.6 9 1.4-3H22"/></svg><span id="streak-n">0</span><span class="lbl" id="streak-l">dias seguidos</span></div>
    <button class="icon-btn" id="btn-theme" aria-label="Alternar tema claro/escuro"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></button>
    <button class="icon-btn" id="btn-menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/></svg></button>
  </div>
</header>
<div class="menu" id="menu" hidden>
  <div class="ml" style="--c:var(--star)"></div><div class="ml" style="--c:color-mix(in srgb,var(--star) 60%,var(--table))"></div><div class="ml" style="--c:color-mix(in srgb,var(--star) 30%,var(--table))"></div>
  <nav class="mpanel" aria-label="Menu">
    <div class="mhead"><span>Menu</span><button class="icon-btn" id="menu-close" aria-label="Fechar menu"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="menu-items"></div>
    <div class="mfoot"><button class="btn ghost" id="mf-stats">Estatísticas</button><button class="btn ghost" id="mf-help">Como jogar</button><button class="btn ghost" id="mf-theme">Tema</button></div>
  </nav>
</div>
<main id="main"></main>
<div class="edge-bottom" aria-hidden="true"></div>
<footer class="foot" id="foot">
  <span>Conteúdo de exemplo, ainda em validação pela curadoria.</span>
  <span>Material educativo. Não substitui avaliação psicológica ou psiquiátrica.</span>
</footer>
<div class="overlay" id="overlay" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><button class="icon-btn close" id="sheet-close" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="sheet-body"></div></div></div>


<script type="module" src="/src/main.js"></script>
</body>
</html>
